name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python examples/quickstart.py --tiny
  min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      # --no-sources: the PyTorch CPU index has no plain torch 2.3.0 wheel for x86_64 Linux (only +cpu builds),
      # so the lowest versions come from PyPI instead.
      - run: uv sync --group dev --resolution lowest-direct --no-sources
      - run: uv run pytest -q
      - run: uv run python examples/quickstart.py --tiny
